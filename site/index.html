<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="Multi News — le monde à travers sa presse. Actualités internationales multilingues."/><title>Multi News — La presse du monde</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#162237;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}header{background:#12233d;color:white;padding:24px max(20px,calc((100vw - 1100px)/2))}header h1{font-size:30px;margin:0;letter-spacing:.04em}header p{margin:4px 0 0;color:#bfcede}.wrap{max-width:1100px;margin:auto;padding:26px 20px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}label{font-weight:600}select,input{border:1px solid #bdc9d7;border-radius:9px;background:white;color:#162237;padding:10px 12px;font:inherit}input{flex:1;min-width:190px}.status{color:#586779;font-size:14px;margin:0 0 10px}.media-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 22px}.media-nav button{font:inherit;font-size:13px;border:1px solid #cbd5e1;color:#263b54;background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer}.media-nav button:hover{background:#edf3f9}.media-nav button[aria-pressed="true"]{background:#12233d;border-color:#12233d;color:#fff}.media-nav .count{opacity:.7;margin-left:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.article{background:white;border:1px solid #e1e5ea;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #1421390b}.article .inner{padding:18px}.article img{display:block;width:100%;height:155px;object-fit:cover;background:#e7edf4}.article h2{font-size:18px;line-height:1.4;margin:9px 0}.article a{color:#172a46;text-decoration:none}.article a:hover{text-decoration:underline}.article p{font-size:14px;color:#506070;line-height:1.55;margin:0 0 12px}.meta{font-size:12px;color:#657386}.empty{padding:35px 0;color:#657386}footer{text-align:center;color:#677789;padding:30px 10px;font-size:13px}@media(max-width:600px){header{padding:22px 18px}.wrap{padding:20px 14px}.toolbar select,.toolbar input{width:100%}}
</style></head><body>
<header><h1>MULTI NEWS</h1><p>Le monde à travers sa presse</p></header>
<main class="wrap"><div class="toolbar"><label for="lang">Langue des actualités</label><select id="lang" aria-label="Langue des actualités"><option value="fr">🇫🇷 Français</option><option value="en">🇬🇧 English</option><option value="es">🇪🇸 Español</option><option value="de">🇩🇪 Deutsch</option><option value="ar">🇸🇦 العربية</option></select><label for="source">Journal</label><select id="source" aria-label="Filtrer par journal"><option value="">Tous les journaux</option></select><input id="search" type="search" placeholder="Rechercher dans les articles…" aria-label="Rechercher"/></div><p id="status" class="status" role="status">Chargement des actualités…</p><nav id="media-nav" class="media-nav" aria-label="Filtrer les actualités par média"></nav><div id="articles" class="grid"></div></main>
<footer>Multi News · Sources originales créditées · Aucun compte requis</footer>
<script>
"use strict";
const langEl=document.querySelector("#lang"),sourceEl=document.querySelector("#source"),queryEl=document.querySelector("#search"),list=document.querySelector("#articles"),status=document.querySelector("#status"),mediaNav=document.querySelector("#media-nav");
const supported=["fr","en","es","de","ar"];const browser=(navigator.languages?.[0]||navigator.language||"en").slice(0,2).toLowerCase();langEl.value=supported.includes(browser)?browser:"en";
let news=[];
function updateSources(){
 const selected=sourceEl.value;
 const sources=[...new Set(news.filter(a=>a.language===langEl.value).map(a=>a.source).filter(Boolean))].sort((a,b)=>a.localeCompare(b,langEl.value));
 sourceEl.replaceChildren();
 const all=document.createElement("option");all.value="";all.textContent="Tous les journaux";sourceEl.append(all);
 for(const name of sources){const option=document.createElement("option");option.value=name;option.textContent=name;sourceEl.append(option)}
 sourceEl.value=sources.includes(selected)?selected:"";
}
function renderMediaNav(){
 const lang=langEl.value,q=queryEl.value.trim().toLocaleLowerCase();
 const visible=news.filter(a=>a.language===lang&&(a.title+" "+a.source+" "+(a.description||"")).toLocaleLowerCase().includes(q));
 const counts=new Map();for(const a of visible){if(a.source)counts.set(a.source,(counts.get(a.source)||0)+1)}
 mediaNav.replaceChildren();
 const addButton=(label,value,count)=>{
  const button=document.createElement("button");button.type="button";button.setAttribute("aria-pressed",String(sourceEl.value===value));
  button.append(document.createTextNode(label));
  const number=document.createElement("span");number.className="count";number.textContent="("+count+")";button.append(number);
  button.addEventListener("click",()=>{sourceEl.value=value;render()});mediaNav.append(button);
 };
 addButton("Tous","",visible.length);
 for(const name of [...counts.keys()].sort((a,b)=>a.localeCompare(b,lang)))addButton(name,name,counts.get(name));
}
function render(){renderMediaNav();const lang=langEl.value,q=queryEl.value.trim().toLocaleLowerCase();const results=news.filter(a=>a.language===lang&&(!sourceEl.value||a.source===sourceEl.value)&&(a.title+" "+a.source+" "+(a.description||"")).toLocaleLowerCase().includes(q));list.replaceChildren();status.textContent=results.length+" article(s) · Langue : "+lang;for(const a of results){const card=document.createElement("article");card.className="article";const inner=document.createElement("div");inner.className="inner";if(a.image&&/^https?:\/\//.test(a.image)){const image=document.createElement("img");image.src=a.image;image.loading="lazy";image.alt="";image.referrerPolicy="no-referrer";image.onerror=()=>image.remove();card.append(image)}const meta=document.createElement("div");meta.className="meta";meta.textContent=a.source+" · "+(a.date?new Date(a.date).toLocaleDateString(lang):"Date inconnue");const h=document.createElement("h2"),link=document.createElement("a");link.href=a.url;link.target="_blank";link.rel="noopener noreferrer";link.textContent=a.title;h.append(link);inner.append(meta,h);if(a.description){const p=document.createElement("p");p.textContent=a.description;inner.append(p)}card.append(inner);list.append(card)}if(!results.length){const message=document.createElement("p");message.className="empty";message.textContent="Aucun article disponible dans cette langue pour le moment.";list.append(message)}}
langEl.addEventListener("change",()=>{sourceEl.value="";updateSources();render()});sourceEl.addEventListener("change",render);queryEl.addEventListener("input",render);fetch("./data/articles.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(d=>{news=Array.isArray(d.articles)?d.articles:[];updateSources();render()}).catch(e=>{status.textContent="Actualités momentanément indisponibles ("+e.message+").";});
</script></body></html>
