name: Publish Multi News
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run collector tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          python -c "from pathlib import Path; s=Path('site/index.html').read_text(); Path('/tmp/multi-news.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/multi-news.js
      - name: Probe potential magazines (diagnostic only)
        if: github.event_name == 'push'
        continue-on-error: true
        run: PYTHONPATH=. python scripts/probe_magazines.py
      - name: Select collection schedule
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "$(date -u +%u)" == "7" ]]; then
              echo "mode=both" >> "$GITHUB_OUTPUT"
            else
              echo "mode=press" >> "$GITHUB_OUTPUT"
            fi
          elif [[ ! -f data/articles.json ]]; then
            echo "mode=both" >> "$GITHUB_OUTPUT"
          else
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect or reuse news
        env:
          COLLECT_MODE: ${{ steps.mode.outputs.mode }}
        run: python scripts/collect.py
      - name: Persist catalogue in repository
        if: steps.mode.outputs.mode != 'publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update RSS catalogue [skip ci]"
            git push
          fi
      - name: Prepare static site
        run: cp -r data site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
