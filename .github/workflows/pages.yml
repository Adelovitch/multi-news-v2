name: Publish Multi News
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Two opportunities per hour: scheduled GitHub Actions may be delayed or skipped.
    - cron: '7,37 3-10,16-21 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run collector tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          python -c "from pathlib import Path; s=Path('site/index.html').read_text(); Path('/tmp/multi-news.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/multi-news.js
          python -c "from pathlib import Path; s=Path('site/tv/index.html').read_text(); Path('/tmp/multi-news-tv.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/multi-news-tv.js
          python -c "from pathlib import Path; s=Path('site/tv/lab/index.html').read_text(); Path('/tmp/multi-news-tv-lab.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/multi-news-tv-lab.js
      - name: Probe candidate French feeds
        if: contains(github.event.head_commit.message, '[probe french]')
        run: PYTHONPATH=. python scripts/probe_french.py
      - name: Diagnose sparse RSS images
        if: contains(github.event.head_commit.message, '[diagnose images]')
        run: PYTHONPATH=. python scripts/diagnose_images.py
      - name: Audit TV catalogue
        if: contains(github.event.head_commit.message, '[audit tv]')
        run: python scripts/audit_tv.py
      - name: Upload TV audit
        if: contains(github.event.head_commit.message, '[audit tv]')
        uses: actions/upload-artifact@v4
        with:
          name: tv-catalogue-audit
          path: reports/tv-audit.json
          retention-days: 30
      - name: Select collection schedule
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[refresh feeds]') }}" == "true" ]]; then
            echo "mode=both" >> "$GITHUB_OUTPUT"
          elif [[ ! -f data/articles.json ]]; then
            echo "mode=both" >> "$GITHUB_OUTPUT"
          else
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect or reuse news
        id: collect
        env:
          COLLECT_MODE: ${{ steps.mode.outputs.mode }}
        run: python scripts/collect.py
      - name: Audit article catalogue
        run: PYTHONPATH=. python scripts/quality_audit.py
      - name: Save quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/quality-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Build lightweight TV directory
        run: python scripts/build_tv_directory.py
      - name: Persist catalogue in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tv-directory.json
          if [[ "${{ steps.collect.outputs.changed }}" == "true" && "${{ steps.mode.outputs.mode }}" != "publish" ]]; then
            git add data/articles.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: update RSS catalogue [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push
          fi
      - name: Prepare static site
        run: cp -r data site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
